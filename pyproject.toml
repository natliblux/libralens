[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "LibraLens"
version = "1.0"
description = "Python library providing methods for the evaluation of MARC 21 records."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.3.0",
    "levenshtein==0.27.4",
    "scipy==1.18.1",
    "tqdm==4.70.0",
]

[project.scripts]
libralens = "libralens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libralens = ["data/*.json"]